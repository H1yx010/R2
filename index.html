<!DOCTYPE html>

<head>

<title>R2 Store - PS4 Jailbreak</title>
<style>
  * { box-sizing: border-box; }
  html, body { 
    margin: 0; 
    padding: 0; 
    background: #080a0f; 
    color: #d0d6e0; 
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* Modern Header Banner */
  #brand { 
    background: linear-gradient(135deg, #0d121c 0%, #161f33 100%);
    border-bottom: 2px solid #1f2c44;
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  #brand-content {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }
  #brand img { 
    width: 48px; 
    height: 48px; 
    border-radius: 50%; 
    border: 2px solid #3b82f6;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    object-fit: cover;
  }
  #brand h1 { 
    font-size: 28px; 
    font-weight: 800; 
    letter-spacing: .15em; 
    color: #ffffff; 
    margin: 0;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  #brand span {
    display: block;
    font-size: 12px;
    color: #3b82f6;
    letter-spacing: .2em;
    margin-top: 4px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Main Container */
  #wrap { 
    flex: 1;
    max-width: 650px;
    width: 100%;
    margin: 30px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Big Status Box */
  .loader-card {
    background: #111827;
    border: 1px solid #1f293d;
    border-radius: 16px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    position: relative;
    overflow: hidden;
  }
  .loader-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
    background-size: 200% 100%;
    animation: shimmer 3s infinite linear;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  #state { 
    font-size: 24px; 
    font-weight: 700; 
    margin: 0 0 12px; 
    color: #f3f4f6;
  }
  #det { 
    font-size: 14px; 
    color: #9ca3af; 
    margin: 0 0 12px; 
    line-height: 1.6;
  }
  #det b { 
    color: #e5e7eb; 
    font-weight: 600; 
  }
  #cache { 
    font-size: 13px; 
    color: #6b7280; 
    margin: 0; 
    min-height: 18px; 
    font-weight: 500;
  }
  #cache.cacheok { color: #34d399; }
  
  .ok { color: #34d399; } 
  .bad { color: #f87171; } 
  .warn { color: #fbbf24; }

  /* Footer Store Info */
  #store-footer {
    margin-top: 30px;
    background: #0d121c;
    border: 1px solid #1a2333;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  #store-footer h3 {
    margin: 0 0 10px;
    font-size: 18px;
    color: #ffffff;
    font-weight: 700;
  }
  #store-footer p {
    margin: 6px 0;
    font-size: 14px;
    color: #9ca3af;
    line-height: 1.5;
  }
  #store-footer .phone {
    font-size: 16px;
    color: #60a5fa;
    font-weight: bold;
    direction: ltr;
    display: inline-block;
  }
  #store-footer .map-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    background: #2563eb;
    color: #ffffff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s, transform 0.2s;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }
  #store-footer .map-btn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div id="brand">
  <div id="brand-content">
    <img src="logo_raw.png" alt="R2 Store Logo">
    <div>
      <h1>R2 STORE</h1>
      <span>PlayStation Services & Jailbreak</span>
    </div>
  </div>
</div>

<div id="wrap">
  <div class="loader-card">
    <div id="state">جاري فحص إصدار النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>

  <div id="store-footer">
    <h3>R2 Store</h3>
    <p>ش الحمامصي متفرع من ش الجلاء البحري بعد جامع المغفرة</p>
    <p>الهاتف: <span class="phone">01067530274</span></p>
    <a href="https://maps.app.goo.gl/hkGzBU5ShFm2UDSH8?g_st=aw" target="_blank" class="map-btn">
      📍 افتح الموقع على خريطة جوجل (Google Maps)
    </a>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "المتصفح ليس جهاز PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- لا توجد ثغرة متاحة لهذا الإصدار";
    }
    detEl.innerHTML = "إصدار النظام <b>" + (key || "غير معروف") + "</b>"
        + " &middot; الثغرة <b>" + (bug || "لا يوجد") + "</b> &middot; " + why;

    if (!bug) { setState("إصدار النظام غير مدعوم", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("جاري تحميل ثغرة " + bug + "...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("يعمل بدون إنترنت -- من الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("محفوظ مؤقتاً", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تنزيل تحديث جديد", true);
        waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                   function () { location.reload(); });
    } else {
        setCache("جاري التحقق من الذاكرة المؤقتة...");
        ac.addEventListener("downloading",
            function () { setCache("جاري التخزين للاستخدام بدون إنترنت (أول تشغيل)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جاري التحميل " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("تم الحفظ للاستخدام بدون إنترنت", true);
            waitForTap("تم التخزين (أول تشغيل) -- اضغط X أو انقر للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل تحديث جديد", true);
            waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("محفوظ -- جاهز للعمل بدون إنترنت", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("تعذر الاتصال بالذاكرة المؤقتة");
            waitForTap("فشل التخزين المؤقت -- اضغط X أو انقر للتشغيل على أي حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("الذاكرة المؤقتة قديمة");
            waitForTap("الذاكرة قديمة -- اضغط X أو انقر للتشغيل", go);
        }, false);
    }
})();
</script>
 <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("Service Worker registered"))
            .catch(err => console.error("Service Worker error:", err));
    });
}
</script>
